# Local dual deploy: API-only backend + nginx frontend (same-origin session/OIDC).
# Usage: docker compose up --build
# Open http://localhost:8080/ (set OIDC_REDIRECT_URI to http://localhost:8080/auth/callback when using OIDC).

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command:
      - bash
      - -c
      - |
        pip install -q -r requirements.txt &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8200
    environment:
      APP_ENV: development
      SERVE_STATIC: "false"
      BASIC_AUTH_ENABLED: "${BASIC_AUTH_ENABLED:-true}"
      BASIC_AUTH_USERNAME: "${BASIC_AUTH_USERNAME:-demo}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-demo}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret}"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: svrmon24
    ports:
      - "8200:8200"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/static:/usr/share/nginx/html/static:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - api